services:
  portfolio:
    image: ghcr.io/vipga195/portfolio:latest
    container_name: portfolio
    ports:
      - "1995:3000"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # CI must build the `trainer` stage of the Dockerfile and push it as this image before this service is started.
  trainer:
    image: ghcr.io/vipga195/portfolio-trainer:latest
    container_name: portfolio-trainer
    restart: unless-stopped
    # Opt-in: a plain `docker compose pull` / `up -d` ignores this service until `--profile trainer` is given
    profiles: ["trainer"]
    # No env_file on purpose: the trainer must not receive the SMTP secrets.
    # PG* variables instead of a URL: the password is used as-is, no URL-encoding needed.
    environment:
      PGHOST: db
      PGUSER: portfolio
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: portfolio
    depends_on:
      db:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s

  db:
    image: postgres:17-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
