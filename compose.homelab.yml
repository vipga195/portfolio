# Homelab (x86_64) layer, built and started by the self-hosted runner:
#   docker compose -f docker-compose.yml -f compose.homelab.yml up -d --build --wait
services:
  portfolio:
    image: portfolio:homelab
    build: .
    mem_limit: 512m
    # Reached by cloudflared (host network) on loopback only.
    ports: !override
      - "127.0.0.1:1995:3000"
  db:
    mem_limit: 512m
